<ul id="slide-out" class="sidenav">
  <li>
    <div class="user-view">
      <div class="background">
        <img
          src="https://img.freepik.com/vector-gratis/fondo-poligonal-realista_52683-59998.jpg?size=626&ext=jpg&ga=GA1.1.1880011253.1699660800&semt=ais"
        />
      </div>
      <!-- En tu archivo HTML -->
      <input
        type="file"
        (change)="updateUserImage($event)"
        style="display: none"
        #fileInput
      />
      <a href="#user" (click)="fileInput.click()">
        <img class="circle" [src]="userImage" />
      </a>
      <a href="#name"
        ><span class="white-text name">{{ nombre }}</span></a
      >
      <a href="#email"
        ><span class="white-text email">{{ correo }}</span></a
      >
    </div>
  </li>
  <li *ngFor="let m of listaMenus">
    <a routerLink="{{ m.ruta }}">{{ m.texto }}</a>
  </li>

  <li>
    <div class="divider"></div>
  </li>
  <li><a class="subheader">Mi Cuenta</a></li>
  <li class="no-padding">
    <ul class="collapsible collapsible-accordion">
      <li>
        <a class="collapsible-header waves-effect white-text custom-link">
          Privacidad<i class="material-icons">folder</i>
        </a>
        <div class="collapsible-body">
          <ul>
            <li>
              <a class="waves-effect" routerLink="/seguridad/cambiar-clave"
                >Cambiar Clave</a
              >
            </li>
            <li>
              <a class="waves-effect" routerLink="/seguridad/cerrar-sesion"
                >Cerrar Sesion</a
              >
            </li>
          </ul>
        </div>
      </li>
    </ul>
  </li>
</ul>
<a
  href="#"
  data-target="slide-out"
  class="sidenav-trigger blue-text text-accent-10"
  ><i class="material-icons">menu</i></a
>
