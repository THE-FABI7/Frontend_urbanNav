<div id="container" class="row valign-wrapper" style="height: 100vh">
  <div class="col s8 m6 offset-m3">
    <div id="forma" class="card">
      <div class="card-content">
        <form [formGroup]="fGroup">
          <div class="input-field">
            <select formControlName="ubicacion" id="ubicacion">
              <option value="" disabled selected>Elige tu ubicacion</option>
              <option value="653fdc18224f421c5ce4991d">U Caldas</option>
              <option value="653fdc49224f421c5ce4991e">Yarumos</option>
              <option value="653fdc5e224f421c5ce4991f">La Fuente</option>
              <option value="653fdc77224f421c5ce49920">Catedral</option>
              <option value="653fdc89224f421c5ce49921">Torre Chipre</option>
              <option value="655109a0d35057aa9d052e48">Plaza de Toros</option>
              <option value="655109b8d35057aa9d052e49">Parque el Lago</option>
              <option value="655109f8d35057aa9d052e4a">Hospital Central</option>
              <option value="65510ab6d35057aa9d052e4b">Parque Bicentenario</option>
              <option value="65510bc8d35057aa9d052e4c">Centro de Innovacion</option>
              <option value="65510be5d35057aa9d052e4d">Plaza de Mercado</option>
              <option value="65510c50d35057aa9d052e4e">U de Manizales</option>
              <option value="65511022d35057aa9d052e52">Parque Alfonso</option>
              <!-- Agrega más opciones según sea necesario -->
            </select>
            <label for="ubicacion">Ubicación</label>
          </div>

          <div class="input-field">
            <select formControlName="estado" id="estado">
              <option value="" disabled selected>Elige su estado</option>
              <option value="LIBRE">Disponible</option>
              <option value="OCUPADO">Ocupado</option>
              <option value="INACTIVO">Inactivo</option>
              <!-- Agrega más opciones según sea necesario -->
            </select>
            <label for="estado">Estado</label>
          </div>
          <button
            class="btn waves-effect waves-light ml100"
            (click)="Actualizar()"
            [disabled]="!fGroup.valid"
          >
            Actualizar
          </button>
        </form>
      </div>
    </div>
  </div>
</div>
