<div class="container">
  <div id="login-page" class="row">
    <div class="col s12 z-depth-6 card-panel">
      <form class="login-form" [formGroup]="fGroup">
        <div class="row"></div>
        <div class="row">
          <div class="info-box col s12">
            <h2>Autenticación de 2 pasos</h2>
            <p>
              Por motivos de seguridad, queremos asegurarnos que eres tu quien
              esta intentando ingresar a tu cuenta
            </p>
            <p>Por favor ingresa el codigo que te enviamos a tu correo</p>
          </div>
        </div>
        <div class="row">
          <div class="input-field col s12">
            <input
              formControlName="codigo"
              class="validate"
              id="2fa"
              type="text"
            />
            <label for="2fa" data-error="wrong" data-success="right"
              >Código</label
            >
          </div>
        </div>
        <div class="row">
          <div class="input-field col s12">
            <button
              (click)="validarCodigo2fa()"
              class="btn waves-effect waves-light col s12 black-button"
            >
              Validar
            </button>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>
