<div id="container" class="row">
  <div class="col s3">
    <div id="forma">
      <form [formGroup]="fGroup">
        <div class="input-field col s12">
          <select formControlName="origen" id="origen">
            <option value="" disabled selected>Elige tu origen</option>
            <option value="653fdc18224f421c5ce4991d">Fatima</option>
            <option value="653fdc49224f421c5ce4991e">Enea</option>
            <!-- Agrega más opciones según sea necesario -->
          </select>
          <label for="origen">Origen</label>
        </div>

        <div class="input-field col s12">
          <select formControlName="destino" id="destino">
            <option value="" disabled selected>Elige tu destino</option>
            <option value="653fdc18224f421c5ce4991d">Fatima</option>
            <option value="653fdc49224f421c5ce4991e">Enea</option>
            <!-- Agrega más opciones según sea necesario -->
          </select>
          <label for="destino">Destino</label>
        </div>

        <button
          class="btn waves-effect waves-light ml100"
          (click)="solicitarServicio()"
          [disabled]="!fGroup.valid"
        >
          Solicitar
        </button>
      </form>
    </div>
  </div>

  <!-- <div id="map" style="height: 300px"></div> -->
  
</div>
