<div class="row">
    <div class="col s12 m6 offset-m3">
      <div class="card">
        <div class="card-content">
          <div class="row">
            <div class="col s12 m6">
              <img src="https://svgsilh.com/svg/24353.svg" alt="Imagen de ejemplo" class="responsive-img">
            </div>
            <div class="col s12 m6">
              <span class="card-title">Inisiar sesión</span>
              <form>
                <div class="row">
                  <div class="input-field col s12">
                    <input id="email" type="email" class="validate" >
                    <label for="email">Usuario</label>
                  </div>
                </div>
                <div class="row">
                  <div class="input-field col s12">
                    <input id="password" type="password" class="validate">
                    <label for="password">Contraseña</label>
                  </div>
                </div>
                <div class="row">
                  <div class="col s6">
                    <button class="btn waves-effect waves-light" type="submit" name="action">Identificar</button>
                  </div>
                  <div class="col s6">
                    <p class="margin right-align medium-small">
                      <a routerLink="/seguridad/recuperar-clave">Olvide mi contraseña</a>
                    </p>
                  </div>
                </div>
                <div class="row">
                  <div class="input-field col s12">
                    <p class="margin medium-small">
                      <a routerLink="/seguridad/registrarse">Registrarse</a>
                    </p>
                  </div>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
