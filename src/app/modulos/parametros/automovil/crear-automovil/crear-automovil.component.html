<form class="container" [formGroup]="fGroup" >
    <input type="hidden" id="autoId">

    <label class="registro">Registro Automovil</label>
    

      <div class="input-field">
        <i class="material-icons prefix">directions_car</i>
        <input input formControlName="marca" id="marca" type="text" class="validate">
        <label for="marca">Marca</label>
      </div>
  
      <div class="input-field">
        <i class="material-icons prefix">directions_car</i>
        <input formControlName="modelo" id="modelo" type="text" class="validate">
        <label for="modelo">Modelo</label>
      </div>
  
      <div class="input-field">
        <i class="material-icons prefix">directions_car</i>
        <input formControlName="placa" id="placa" type="text" class="validate">
        <label for="placa">Placa</label>
      </div>
  
      <div class="input-field">
        <i class="material-icons prefix">event</i>
        <input formControlName="fecha" id="fecha" type="text" class="validate">
        <label for="fecha">Fecha del Automóvil</label>
      </div>
  
      <div class="input-field">
        <i class="material-icons prefix">lock</i>
        <input formControlName="Soat" id="Soat" type="date" class="validate">
        <label for="Soat">Soat</label>
      </div>
  
      <input type="hidden" id="conductorId">
  
      <div class="file-field input-field">
        <div class="btn">
          <span>Foto</span>
          <input formControlName="foto" id="foto" type="file" class="validate">
        </div>
        <div class="file-path-wrapper">
          <input class="file-path validate" type="text">
        </div>
      </div>
    

    <button (click)="registrarse()" class="btn waves-effect waves-light" type="submit" name="action">Enviar
      <i class="material-icons right">send</i>
    </button>

  </form>
