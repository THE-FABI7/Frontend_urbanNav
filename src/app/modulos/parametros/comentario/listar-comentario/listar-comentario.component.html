<div class="row" *ngFor="let comentario of lisarComentarios">
  <div class="col s12 m6">
    <div class="card blue-grey darken-1">
      <div class="card-content white-text">
        <span class="card-title">Comentario del Conductor</span>
        <p>Calificación: {{comentario.CalificacionConductor}}</p>
        <p>Comentario: {{comentario.ComentarioConductor}}</p>
      </div>
    </div>
  </div>
  <div class="col s12 m6">
    <div class="card blue-grey darken-1">
      <div class="card-content white-text">
        <span class="card-title">Comentario del Cliente</span>
        <p>Calificación: {{comentario.CalificacionCliente}}</p>
        <p>Comentario: {{comentario.ComentarioCliente}}</p>
      </div>
    </div>
  </div>
</div>
